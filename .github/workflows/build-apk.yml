name: build-apk

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure .env.local (Netease API endpoint)
        run: |
          cat > .env.local <<'EOF'
          VITE_NETEASE_API_BASE=https://folia-netease-api.vercel.app
          EOF

      - name: Build web (capacitor target) and sync android
        run: npm run cap:sync:android

      - name: Assemble debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: folia-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create folia-apk --title "Folia Android APK" --notes "Debug APK（GitHub Actions 自动构建）" android/app/build/outputs/apk/debug/app-debug.apk || \
          gh release upload folia-apk android/app/build/outputs/apk/debug/app-debug.apk --clobber
